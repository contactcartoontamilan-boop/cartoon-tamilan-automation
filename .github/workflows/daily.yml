name: CartoonTamilan Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: cartoontamilan-daily
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automation
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          PUBLISH_FACEBOOK: ${{ vars.PUBLISH_FACEBOOK || 'false' }}
          PUBLISH_INSTAGRAM: ${{ vars.PUBLISH_INSTAGRAM || 'false' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python main.py
      - name: Save deduplication state
        run: |
          git config user.name "CartoonTamilan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update automation state"
          git push
