name: CartoonTamilan Marketing OS V13 validation
on:
  push:
    branches: [main]
    paths:
      - 'ctos/**'
      - 'ct_master.py'
      - 'test_ct_v13.py'
      - 'setup_oracle_v13.sh'
      - 'phone_gallery_sync_v13.sh'
      - '.github/workflows/v13-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ctos/**'
      - 'ct_master.py'
      - 'test_ct_v13.py'
      - 'setup_oracle_v13.sh'
      - 'phone_gallery_sync_v13.sh'
      - '.github/workflows/v13-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Font, sound and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0 ffmpeg espeak-ng
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          bash -n setup_oracle_v13.sh
          bash -n phone_gallery_sync_v13.sh
          python -m compileall -q .
      - name: V13 offline tests and inherited regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -q
