name: V14 P0 story ingest and visual QA offline

on:
  push:
    branches:
      - feature/v14-p0-story-ingestion-visual-qa
  pull_request:
    branches:
      - feature/v14-auto-image-post-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0 ffmpeg
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Compile modified modules
        run: |
          python -m compileall -q ct_v14_story_ingest.py ct_v14_scene_art.py ct_v14_control_center.py ctos/creative.py comfyui_art_v9.py test_ct_v14_story_ingest.py test_ct_v14_scene_art.py test_ct_v14_control_center.py
      - name: Offline V14 and existing image regression suite
        run: |
          python -m unittest test_ct_v14_story_ingest.py test_ct_v14_scene_art.py test_ct_v14_control_center.py test_ct_v14_image_post.py test_ct_v14_social_queue.py test_ct_v14.py test_ct_v13.py -v
