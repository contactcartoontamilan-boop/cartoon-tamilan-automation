name: V14 FB Instagram X publishing offline tests

on:
  push:
    branches:
      - feature/v14-social-publish-fb-ig-x-qa
    paths:
      - 'ct_v14_social_publish.py'
      - 'test_ct_v14_social_publish.py'
      - 'ct_v14_social_queue.py'
      - 'README_V14_SOCIAL_PUBLISH.md'
      - '.github/workflows/v14-social-publish-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-social-publish-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies and Tamil fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install requests-oauthlib
      - name: Syntax check
        run: python -m compileall -q ct_v14_social_publish.py test_ct_v14_social_publish.py
      - name: Offline mocked API and regression tests
        run: |
          python -m unittest test_ct_v14_social_publish.py test_ct_v14_social_queue.py test_ct_v14_image_post.py -v
