name: CartoonTamilan V9-V10 tests
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/v9-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Tamil fonts and text shaping support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run safe, offline unit tests
        run: |
          python -m unittest test_premium_v10.py test_story_bible_v10.py test_story_context_v10.py test_campaign_v9.py test_cinematic_v9.py test_story_marketing.py test_review_posters.py test_poster.py test_auto_story_cover.py test_assets.py -v
